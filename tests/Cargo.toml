[package]
name = "blockrouter-tests"
version = "0.1.0"
edition.workspace = true
rust-version = "1.97.1"
publish = false

# One test binary: add new files as `mod` lines in main.rs.
[[test]]
name = "integration"
path = "main.rs"

[dev-dependencies]
blockrouter = { path = "../programs/blockrouter", features = ["no-entrypoint"] }
anchor-lang = "=1.2.0"
litesvm = "=0.17.0"
solana-account = "=4.7.0"
solana-keypair = "=3.1.2"
solana-transaction = { version = "=4.3.0", features = ["wincode"] }
